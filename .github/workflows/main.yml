name: WeQ4UServices CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for quotation PDFs
        run: npx playwright install --with-deps chromium

      - name: Test service request workflows
        run: npm test

      - name: Build all apps
        run: npm run build

      - name: Lint all apps
        run: npm run lint
