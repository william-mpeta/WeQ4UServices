openapi: 3.0.3
info:
  title: WeQ4UServices API
  version: 0.2.0-draft
  description: >-
    Proposed API contract for a managed request platform. Existing prototype endpoints
    are identified separately from planned endpoints. Do not treat this draft as a deployed API.
servers:
  - url: https://api.example.invalid/api
    description: Placeholder; production host not selected
tags:
  - name: Public requests
  - name: Customer actions
  - name: Staff requests
  - name: Quotes
  - name: Documents
paths:
  /health:
    get:
      tags: [Public requests]
      summary: API health
      responses:
        '200':
          description: API is responding
  /requests:
    post:
      tags: [Public requests]
      summary: Submit a service request
      description: Existing prototype endpoint. Production payload and consent version need final approval.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, phone, suburb, consent, services]
              properties:
                name: { type: string, maxLength: 100 }
                phone: { type: string, maxLength: 30 }
                email: { type: string, format: email, maxLength: 200 }
                suburb: { type: string, maxLength: 120 }
                address: { type: string, maxLength: 400, description: Optional until collection is confirmed }
                message: { type: string, maxLength: 1000 }
                consent: { type: boolean }
                courier: { type: boolean }
                services:
                  type: array
                  minItems: 1
                  items: { type: string }
                serviceDetails:
                  type: string
                  description: JSON object keyed by service ID; replace with versioned service-specific schema before production.
                documentLabels:
                  type: string
                  description: JSON array of approved service/document checklist keys in file order.
                documents:
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Request received
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref: { type: string, example: WQ-2026-7A3D90C41B82F64A21E0, description: Cryptographically random customer tracking reference; treat as a bearer credential. }
                  status: { type: string, example: Received }
                  createdAt: { type: string, format: date-time }
        '400': { description: Validation error }
        '413': { description: Upload is too large }
  /requests/{ref}:
    get:
      tags: [Public requests]
      summary: Read customer request tracking using the private bearer reference
      parameters:
        - in: path
          name: ref
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Request tracking data authorized by the unguessable reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref: { type: string }
                  status: { type: string }
                  createdAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
        '404': { description: Reference not found }
  /requests/{ref}/documents:
    post:
      tags: [Customer actions]
      summary: Upload requested or supporting documents for a request
      description: Existing prototype endpoint. Requested files clear matching document requests; supporting files are labelled, added to the timeline, and do not change the workflow stage. Accepts PDF, JPG and PNG files up to 8 MB each, with at most 10 files per request. The private request reference is a bearer credential.
      parameters:
        - in: path
          name: ref
          required: true
          schema: { type: string }
        - in: header
          name: X-Request-Access-Key
          required: false
          schema: { type: string }
          description: Required only when the request uses a separate access key.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [documentLabels, documents]
              properties:
                documentLabels: { type: string, description: JSON array of labels in file order }
                requestedDocumentLabels: { type: string, description: Optional JSON array identifying requested documents; omit to treat all uploaded files as requested documents }
                documents:
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
      responses:
        '200': { description: Documents received and request timeline updated }
        '400': { description: Invalid labels, file count, or upload }
        '403': { description: Request access denied }
        '409': { description: Requested documents are not expected, request is closed, or stage does not allow the upload }
  /requests/{ref}/customer-tasks/{taskId}/response:
    post:
      tags: [Customer actions]
      summary: Respond to an open information, appointment or delivery task
      description: Existing prototype endpoint. The cryptographically random request reference is a bearer credential; only keep it private and share it with the customer.
      parameters:
        - in: path
          name: ref
          required: true
          schema: { type: string }
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: Response recorded; task awaits staff review }
        '400': { description: Empty or invalid response }
        '403': { description: Request access denied }
        '409': { description: Task already answered or completed }
  /requests/{ref}/quote-decision:
    post:
      tags: [Customer actions]
      summary: Accept or decline the current quote version
      description: Requires the quote ID and version displayed in the private tracking portal. Declines require a reason. The request reference is a bearer credential.
      parameters:
        - in: path
          name: ref
          required: true
          schema: { type: string }
        - in: header
          name: X-Request-Access-Key
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, quoteId, quoteVersion]
              properties:
                decision: { type: string, enum: [accept, decline] }
                quoteId: { type: string }
                quoteVersion: { type: integer, minimum: 1 }
                declineReason: { type: string, enum: [too-expensive, not-ready, chose-another-provider, incorrect-details, other] }
                declineDetails: { type: string, maxLength: 500, description: Required when declineReason is other }
      responses:
        '200': { description: Quote decision recorded with timestamp and quote version }
        '400': { description: Invalid decision or missing decline reason }
        '403': { description: Request access denied }
        '409': { description: Quote expired, already decided, or no longer current }
  /admin/requests/{ref}/customer-tasks:
    post:
      tags: [Customer actions]
      summary: Create a customer clarification, appointment or delivery task
      description: Existing prototype endpoint; requires requests:update. Task email notifications depend on configured email delivery.
      security: [{ staffBearer: [] }]
      parameters:
        - in: path
          name: ref
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, message]
              properties:
                type: { type: string, enum: [information, appointment, delivery] }
                title: { type: string, maxLength: 120 }
                message: { type: string, maxLength: 1000 }
                dueDate: { type: string, format: date }
      responses:
        '201': { description: Customer task created and notification attempted }
        '400': { description: Invalid task }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '404': { description: Request not found }
  /admin/requests/{ref}/customer-tasks/{taskId}:
    patch:
      tags: [Customer actions]
      summary: Mark a customer action complete
      security: [{ staffBearer: [] }]
      parameters:
        - in: path
          name: ref
          required: true
          schema: { type: string }
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [completed] }
      responses:
        '200': { description: Customer action completed }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '404': { description: Task not found }
  /admin/requests:
    get:
      tags: [Staff requests]
      summary: Search and list requests
      security: [{ staffBearer: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: service
          schema: { type: string }
        - in: query
          name: assignedTo
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: Staff request page }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
      x-implementation-status: planned; prototype currently returns all records with an admin API token
  /admin/requests/{ref}:
    get:
      tags: [Staff requests]
      summary: Read request workspace data
      security: [{ staffBearer: [] }]
      parameters:
        - in: path
          name: ref
          required: true
          schema: { type: string }
      responses:
        '200': { description: Request details with service answers, checklist, assignment and history }
        '404': { description: Reference not found }
    patch:
      tags: [Staff requests]
      summary: Update a request through an allowed workflow transition
      security: [{ staffBearer: [] }]
      parameters:
        - in: path
          name: ref
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toStatus: { type: string }
                internalNote: { type: string, maxLength: 2000 }
                assignedDepartmentId: { type: string, format: uuid }
                assignedTo: { type: string, format: uuid }
      responses:
        '200': { description: Updated request and resulting events }
        '409': { description: Transition is not allowed from the current state }
        '403': { description: Permission denied }
      x-implementation-status: prototype enforces customer-aligned stages and pricing-engine quote generation; caller-supplied quote amounts are rejected
  /admin/requests/{ref}/quotes:
    post:
      tags: [Quotes]
      summary: Create a quote version
      security: [{ staffBearer: [] }]
      parameters:
        - in: path
          name: ref
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, validUntil, lines]
              properties:
                currency: { type: string, enum: [ZAR] }
                validUntil: { type: string, format: date-time }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [category, description, quantity, unitAmountMinor]
                    properties:
                      category: { type: string, enum: [handling, authority, third_party, courier, other] }
                      description: { type: string, maxLength: 300 }
                      quantity: { type: number, exclusiveMinimum: 0 }
                      unitAmountMinor: { type: integer, minimum: 0 }
      responses:
        '201': { description: Quote version created in draft state }
        '403': { description: Permission denied }
      x-implementation-status: planned
  /admin/requests/{ref}/documents/{documentId}:
    get:
      tags: [Documents]
      summary: Download a document after permission and scan-state checks
      security: [{ staffBearer: [] }]
      parameters:
        - in: path
          name: ref
          required: true
          schema: { type: string }
        - in: path
          name: documentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Document bytes }
        '403': { description: Permission denied }
        '404': { description: Document not found }
      x-implementation-status: prototype has token-protected download; role and malware checks planned
components:
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
